# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-torizon-sb-x86-testing"
BBFILE_PATTERN_meta-torizon-sb-x86-testing := "^${LAYERDIR}/"
# Above meta-toradex-torizon (90) so our bbappends/overrides win.
BBFILE_PRIORITY_meta-torizon-sb-x86-testing = "95"

LAYERDEPENDS_meta-torizon-sb-x86-testing = "intel meta-toradex-torizon"
LAYERSERIES_COMPAT_meta-torizon-sb-x86-testing = "scarthgap"
